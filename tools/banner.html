<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>AI Diligence — LinkedIn banner</title>
<!-- Rendered by tools/banners.py: ?kind=profile|company&lang=fr|en, viewport = banner size. -->
<style>
@font-face { font-family: 'Inter'; src: url(../assets/fonts/inter-latin.woff2) format('woff2'); font-weight: 300 600; }
@font-face { font-family: 'JetBrains Mono'; src: url(../assets/fonts/jetbrainsmono-latin.woff2) format('woff2'); font-weight: 400 500; }
@font-face { font-family: 'Unbounded'; src: url(../assets/fonts/unbounded-latin.woff2) format('woff2'); font-weight: 300 700; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  position: relative; color: #eceaf6; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased;
  background: radial-gradient(120% 160% at 78% 30%, #161c4c 0%, #0a0d1f 45%, #04050c 82%);
}
canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.veil { position: absolute; inset: 0; background: radial-gradient(130% 120% at 50% 50%, transparent 60%, rgba(2, 3, 8, .6) 100%); }
.copy { position: absolute; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; }
.eyebrow { display: flex; align-items: center; font: 500 1em/1.3 'JetBrains Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: #a3a6c2; }
.eyebrow i { width: .55em; height: .55em; border-radius: 50%; background: #6fd6ff; box-shadow: 0 0 .8em #6fd6ff; margin-right: .9em; }
h1 { margin: 0; font: 300 1em/1.08 'Unbounded', sans-serif; letter-spacing: -.02em; }
h1 em { font-style: normal; font-weight: 700; background: linear-gradient(100deg, #6fd6ff, #8b7bff); -webkit-background-clip: text; background-clip: text; color: transparent; }
.services { display: flex; flex-wrap: wrap; column-gap: 1.6em; row-gap: .3em; font: 400 1em/1.3 'Inter', sans-serif; color: #cfd0e4; }
.services b { font: 500 .78em/1 'JetBrains Mono', monospace; color: #6fd6ff; margin-right: .55em; }
.links { font: 500 1em/1 'JetBrains Mono', monospace; letter-spacing: .04em; color: #6fd6ff; }

/* Personal profile, 1584 × 396: the photo covers the bottom left. */
.profile .copy { left: 430px; gap: 18px; max-width: 760px; }
.profile .eyebrow { font-size: 14px; }
.profile h1 { font-size: 42px; }
.profile .services { font-size: 17px; }
.profile .links { font-size: 14px; }
/* Company page, 1128 × 191: the page logo covers the bottom left. */
.company .copy { left: 220px; gap: 10px; max-width: 560px; }
.company .eyebrow { font-size: 10.5px; }
.company h1 { font-size: 25px; }
.company .services { font-size: 12.5px; column-gap: 1.3em; }
.company .links { font-size: 11px; }
</style>
<script type="importmap">{ "imports": { "three": "../assets/vendor/three.module.js" } }</script>
</head>
<body>
<canvas id="field"></canvas>
<div class="veil"></div>
<div class="copy">
  <div class="eyebrow"><i></i><span id="eyebrow"></span></div>
  <h1 id="title"></h1>
  <div class="services" id="services"></div>
  <div class="links" id="links"></div>
</div>
<script type="module">
import { Field } from '../assets/js/field.js';

// Copy from the site (tools/build.py) and from me.paulasquin.com.
const SERVICES = {
  fr: ['Ingénierie IA &amp; MLOps', 'Audit de stack IA (due diligence)', "Pilotage d'équipes et de projets IA"],
  en: ['AI &amp; MLOps Engineering', 'AI Stack Due Diligence Audit', 'AI Team &amp; Project Management'],
};
const COPY = {
  profile: {
    fr: { eyebrow: 'AI Diligence · Freelance IA', title: 'Intelligence artificielle,<br><em>du prototype à la production</em>', links: 'aidiligence.eu · me.paulasquin.com' },
    en: { eyebrow: 'AI Diligence · Freelance AI', title: 'Artificial intelligence,<br><em>from prototype to production</em>', links: 'aidiligence.eu · me.paulasquin.com' },
  },
  company: {
    fr: { eyebrow: 'Due diligence en intelligence artificielle', title: "Investir dans l'IA,<br><em>sur des bases solides</em>", links: 'aidiligence.eu' },
    en: { eyebrow: 'Artificial Intelligence Due Diligence', title: 'Investing in AI,<br><em>on solid ground</em>', links: 'aidiligence.eu' },
  },
};
const q = new URLSearchParams(location.search);
const kind = q.get('kind') === 'company' ? 'company' : 'profile', lang = q.get('lang') === 'en' ? 'en' : 'fr';
const c = COPY[kind][lang];
document.documentElement.lang = lang;
document.body.className = kind;
document.getElementById('eyebrow').innerHTML = c.eyebrow;
document.getElementById('title').innerHTML = c.title;
document.getElementById('services').innerHTML = SERVICES[lang].map((s, i) => `<span><b>0${i + 1}</b>${s}</span>`).join('');
document.getElementById('links').innerHTML = c.links;

// The wheel of the site's hero, pushed to the right, a pulse halfway up its spokes.
const field = new Field(document.getElementById('field'), { count: 24000, reduced: false });
// Point sizes are in pixels: smaller on these short banners, or the additive light burns the wheel white.
field.uniforms.uSize.value = kind === 'company' ? 9 : 16;
field.side = 1;
field.applyView(true);
field.holder.position.x = field.frame().hw * (kind === 'company' ? 0.74 : 0.7);
field.update(1.6, 0);
await document.fonts.ready;
requestAnimationFrame(() => { field.update(1.6, 0); document.body.dataset.ready = '1'; });
</script>
</body>
</html>
